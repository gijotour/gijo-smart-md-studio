<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIJO Smart MD Studio - 이미지가 들어가는 마크다운(MD) 전용 문서 작성기</title>

  <!-- Font Awesome Icons (vendored locally — see vendor/VERSIONS.md) -->
  <link rel="stylesheet" href="vendor/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/solid.min.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/regular.min.css">

  <!-- Markdown parser + HTML sanitizer (vendored locally — see vendor/VERSIONS.md) -->
  <script src="vendor/marked/marked.js"></script>
  <script src="vendor/dompurify/purify.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Header -->
    <header class="app-header">
      <button id="btn-sidebar-toggle" class="btn btn-icon" title="문서함 열기/닫기" aria-label="문서함 열기/닫기" aria-expanded="true" aria-controls="doc-sidebar">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="brand">
        <i class="fa-solid fa-file-signature brand-icon"></i>
        <div class="brand-text">
          <h1>GIJO Smart MD Studio</h1>
          <span class="badge">v2.0</span>
        </div>
      </div>

      <div class="header-center">
        <input type="text" id="document-title" class="title-input" value="개발 요청 및 기술 문서" placeholder="문서 제목을 입력하세요...">
      </div>

      <div class="header-actions">
        <button id="btn-theme-toggle" class="btn btn-icon" title="테마 변경 (다크/라이트)" aria-label="테마 변경">
          <i class="fa-solid fa-moon"></i>
        </button>
        <button id="btn-clear" class="btn btn-secondary" title="새로 작성">
          <i class="fa-solid fa-rotate-left"></i> 초기화
        </button>
        <button id="btn-copy-md" class="btn btn-primary-gradient" title="마크다운 전체 복사">
          <i class="fa-solid fa-copy"></i> MD 복사
        </button>
        <div class="dropdown" id="export-dropdown">
          <button id="btn-export-toggle" class="btn btn-success" title="내보내기" aria-haspopup="true" aria-expanded="false">
            <i class="fa-solid fa-file-export"></i> 내보내기 <i class="fa-solid fa-caret-down"></i>
          </button>
          <div class="dropdown-menu" id="export-menu">
            <button class="dropdown-item" data-export="md"><i class="fa-solid fa-file-lines"></i> Markdown (.md)</button>
            <button class="dropdown-item" data-export="html"><i class="fa-solid fa-file-code"></i> HTML (.html)</button>
            <button class="dropdown-item" data-export="pdf"><i class="fa-solid fa-file-pdf"></i> PDF (.pdf)</button>
            <button class="dropdown-item" data-export="docx"><i class="fa-solid fa-file-word"></i> Word (.docx)</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Preset Template Bar -->
    <section class="template-bar">
      <span class="template-label"><i class="fa-solid fa-wand-magic-sparkles"></i> 빠른 템플릿:</span>
      <div class="template-buttons">
        <button class="template-btn" data-template="bug"><i class="fa-solid fa-bug"></i> 버그 수정 요청</button>
        <button class="template-btn" data-template="feature"><i class="fa-solid fa-rocket"></i> 신규 기능 요청</button>
        <button class="template-btn" data-template="ui"><i class="fa-solid fa-palette"></i> UI/디자인 변경</button>
        <button class="template-btn" data-template="refactor"><i class="fa-solid fa-code"></i> 코드 리팩토링</button>
      </div>
    </section>

    <div class="app-body" id="app-body">
      <!-- Document Library Sidebar -->
      <aside class="doc-sidebar" id="doc-sidebar">
        <button id="btn-new-doc" class="btn btn-primary-gradient sidebar-new-btn">
          <i class="fa-solid fa-plus"></i> 새 문서
        </button>
        <div class="sidebar-section-label"><i class="fa-solid fa-folder-open"></i> 문서함</div>
        <div id="document-list" class="document-list"></div>
      </aside>

    <!-- Main Workspace -->
    <main class="workspace">
      <!-- Toolbar -->
      <div class="editor-toolbar">
        <div class="toolbar-group">
          <button class="tb-btn" data-cmd="h1" title="제목 1 (Ctrl+1)"><b>H1</b></button>
          <button class="tb-btn" data-cmd="h2" title="제목 2 (Ctrl+2)"><b>H2</b></button>
          <button class="tb-btn" data-cmd="h3" title="제목 3 (Ctrl+3)"><b>H3</b></button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button class="tb-btn" data-cmd="bold" title="굵게 (Ctrl+B)" aria-label="굵게"><i class="fa-solid fa-bold"></i></button>
          <button class="tb-btn" data-cmd="italic" title="기울임 (Ctrl+I)" aria-label="기울임"><i class="fa-solid fa-italic"></i></button>
          <button class="tb-btn" data-cmd="strikethrough" title="취소선" aria-label="취소선"><i class="fa-solid fa-strikethrough"></i></button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button class="tb-btn" data-cmd="ul" title="글머리 기호 목록" aria-label="글머리 기호 목록"><i class="fa-solid fa-list-ul"></i></button>
          <button class="tb-btn" data-cmd="ol" title="번호 목록" aria-label="번호 목록"><i class="fa-solid fa-list-ol"></i></button>
          <button class="tb-btn" data-cmd="task" title="체크리스트" aria-label="체크리스트"><i class="fa-solid fa-square-check"></i></button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button class="tb-btn" data-cmd="code" title="코드 블록" aria-label="코드 블록"><i class="fa-solid fa-code"></i></button>

          <button class="tb-btn" data-cmd="table" title="표 삽입" aria-label="표 삽입"><i class="fa-solid fa-table"></i></button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <label for="image-file-input" class="tb-btn" title="이미지 파일 첨부">
            <i class="fa-solid fa-image"></i> 이미지 선택
          </label>
          <input type="file" id="image-file-input" accept="image/*" multiple style="display: none;">
          <span class="paste-hint"><i class="fa-regular fa-clipboard"></i> 캡처 후 <b>Ctrl+V</b>로 바로 붙여넣기 지원</span>
        </div>
        <div class="toolbar-right">
          <button id="btn-view-word" class="tb-btn" title="MS Word 스타일 용지 문서 편집 모드">
            <i class="fa-solid fa-file-lines"></i> 워드 문서 모드
          </button>
          <button id="btn-toggle-view" class="tb-btn active" title="나란히 보기 / 편집 전용">
            <i class="fa-solid fa-columns"></i> 분할 뷰
          </button>
        </div>
      </div>

      <!-- Editor & Preview Split Container -->
      <div class="split-pane" id="split-pane">
        <!-- Left: Editor Area -->
        <div class="editor-area">
          <div class="pane-header">
            <span><i class="fa-solid fa-pen-to-square"></i> 편집기 (Markdown)</span>
            <span class="char-count" id="char-count">0 자</span>
          </div>
          <textarea id="editor" class="editor-textarea" placeholder="여기에 내용을 입력하거나 스크린샷을 Ctrl+V 로 붙여넣으세요..."></textarea>
          <div class="drop-overlay" id="drop-overlay">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <p>이미지를 이 곳에 놓으면 마크다운에 자동 삽입됩니다!</p>
          </div>
        </div>

        <!-- Right: Live Preview Area -->
        <div class="preview-area">
          <div class="pane-header">
            <span><i class="fa-solid fa-eye"></i> 실시간 미리보기 (렌더링 화면)</span>
            <span class="image-count" id="image-count"><i class="fa-solid fa-image"></i> 이미지 0개</span>
          </div>
          <div id="preview" class="preview-content markdown-body"></div>
        </div>
      </div>
    </main>
    </div>

    <!-- Footer Status Bar -->
    <footer class="app-footer">
      <div class="status-left">
        <span class="status-indicator"><i class="fa-solid fa-circle-check"></i> 자동 저장됨</span>
        <span id="save-time">방금 전</span>
      </div>
      <div class="status-right">
        <span>이미지 자동 Base64 인코딩 지원</span>
        <span>|</span>
        <span>Antigravity IDE Tool</span>
      </div>
    </footer>
  </div>

  <!-- Toast Notification System -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Version History Modal -->
  <div class="modal-overlay" id="history-modal">
    <div class="modal-box">
      <div class="modal-header">
        <span><i class="fa-solid fa-clock-rotate-left"></i> 버전 히스토리</span>
        <button id="btn-history-close" class="btn btn-icon" title="닫기"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="history-list" class="history-list"></div>
    </div>
  </div>

  <script src="vendor/html-to-docx/polyfills.js"></script>
  <script src="vendor/html-to-docx/html-to-docx.browser.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
