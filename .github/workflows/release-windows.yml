name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish under (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Exclude workspace from Windows Defender scanning
        shell: powershell
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - run: npm ci

      - name: Build Windows installer
        shell: bash
        run: npm run build:win 2>&1 | tee build-win.log

      - name: Upload build log (only if the build step failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-win-log
          path: build-win.log

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: dist/*.exe
          generate_release_notes: true
